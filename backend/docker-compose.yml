services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-simlaw}
      POSTGRES_USER: ${POSTGRES_USER:-simlaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
    depends_on:
      postgres:
        condition: service_healthy
      adaptive:
        condition: service_healthy
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 bytes)}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-}
      OPENAI_MODEL_NAME: ${OPENAI_MODEL_NAME:-}
      SIMLAW_PROMPT_PROFILE: ${SIMLAW_PROMPT_PROFILE:-prod}
      SIMLAW_FALLBACK_MODEL_API_KEY: ${SIMLAW_FALLBACK_MODEL_API_KEY:-}
      SIMLAW_FALLBACK_MODEL_API_BASE_URL: ${SIMLAW_FALLBACK_MODEL_API_BASE_URL:-}
      SIMLAW_FALLBACK_MODEL_NAME: ${SIMLAW_FALLBACK_MODEL_NAME:-}
      SIMLAW_FALLBACK_MODEL_TIMEOUT_SECONDS: ${SIMLAW_FALLBACK_MODEL_TIMEOUT_SECONDS:-180}
      SIMLAW_FALLBACK_CIRCUIT_SECONDS: ${SIMLAW_FALLBACK_CIRCUIT_SECONDS:-900}
      SIMLAW_PLAYER_LAWYER_MODE: ${SIMLAW_PLAYER_LAWYER_MODE:-}
      SIMLAW_PLAYER_LAWYER_TIMEOUT_SECONDS: ${SIMLAW_PLAYER_LAWYER_TIMEOUT_SECONDS:-86400}
      SIMLAW_ADAPTIVE_API_BASE_URL: http://adaptive:8010
      SIMLAW_ADAPTIVE_API_KEY: ${SIMLAW_ADAPTIVE_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - sandbox_data:/app/backend/sandbox_data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8000/api/status >/dev/null",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  adaptive:
    build:
      context: ..
      dockerfile: adaptive_service/Dockerfile
    environment:
      SIMLAW_ADAPTIVE_API_KEY: ${SIMLAW_ADAPTIVE_API_KEY:-}
      SIMLAW_ADAPTIVE_DB_PATH: /app/runtime/adaptive.db
      SIMLAW_ADAPTIVE_DATA_DIR: /app/data
    expose:
      - "8010"
    volumes:
      - adaptive_data:/app/runtime
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  adaptive_data:
  sandbox_data:
